name: Verify Windward
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: |
          python -m uvicorn index:app --host 127.0.0.1 --port 8000 > /tmp/windward-api.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break || sleep 1; done
          cd frontend
          TEST_BASE_URL=http://127.0.0.1:8000 PLAYWRIGHT_CHANNEL=chromium npx playwright test
      - name: Docker smoke check
        run: |
          docker compose config --quiet
          docker compose up --build -d --wait
          curl --fail http://127.0.0.1:8080/
          curl --fail http://127.0.0.1:8080/api/health
          curl --fail http://127.0.0.1:8080/api/summary
      - if: always()
        run: docker compose down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: artifacts/
