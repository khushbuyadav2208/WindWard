services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DECISION_CUTOFF: ${DECISION_CUTOFF:-10:00}
      REFRESH_TOKEN: ${REFRESH_TOKEN:-}
      CACHE_PATH: /workspace/cache/cache.json
    volumes:
      - windward-cache:/workspace/cache
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  windward-cache:
